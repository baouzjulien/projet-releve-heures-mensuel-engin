<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Releve Engins">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Releve d'heure mensuel - HR Occitanie</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --noir:#0f0f0f; --blanc:#f5f4f0; --gris-leger:#e8e7e3;
    --gris-moyen:#c2c0b8; --gris-fonce:#6b6960;
    --accent:#1a1a2e; --accent-light:#2d2d4a;
    --rouge:#c0392b; --vert:#1a6b3c;
    --bordure:1.5px solid #0f0f0f; --bordure-fine:1px solid #0f0f0f;
    --font-mono:'IBM Plex Mono', monospace; --font-sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#d9d8d2;font-family:var(--font-sans);min-height:100vh;padding:24px 16px 60px;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(0,0,0,.04) 27px,rgba(0,0,0,.04) 28px),
    repeating-linear-gradient(90deg,transparent,transparent 27px,rgba(0,0,0,.02) 27px,rgba(0,0,0,.02) 28px)}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:80vh}
  .login-card{background:var(--blanc);border:2px solid var(--noir);box-shadow:6px 6px 0 var(--noir);padding:36px 30px;max-width:380px;width:100%;text-align:center}
  .login-logo{width:96px;height:96px;object-fit:contain;margin:0 auto 18px;display:block}
  .login-titre{font-size:20px;font-weight:600;line-height:1.2;margin-bottom:6px}
  .login-sous-titre{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gris-fonce);margin-bottom:28px}
  .pin-label,.label{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gris-fonce);margin-bottom:7px;display:block}
  .pin-input{font-family:var(--font-mono);font-size:28px;font-weight:600;letter-spacing:8px;text-align:center;border:2px solid var(--noir);background:white;color:var(--noir);padding:12px 16px;width:100%;outline:none;margin-bottom:16px}
  .pin-input:focus,.field:focus{background:#ffeaa7}
  .login-erreur{font-family:var(--font-mono);font-size:11px;color:var(--rouge);margin-bottom:12px;min-height:16px}
  #app-screen{display:none}
  .document{max-width:760px;margin:0 auto;background:var(--blanc);border:2px solid var(--noir);box-shadow:6px 6px 0 var(--noir)}
  .user-bar{background:var(--accent);color:var(--blanc);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:11px}
  .user-bar-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.user-bar-nom{font-weight:600;font-size:13px}.user-bar-role{background:rgba(255,255,255,.15);padding:3px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .btn-deconnexion{font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--rouge);border:2px solid #fff;color:#fff;padding:7px 12px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}
  .entete{padding:20px 22px 16px;border-bottom:var(--bordure);display:flex;align-items:center;gap:18px}
  .app-logo{width:68px;height:68px;object-fit:contain;flex:0 0 auto}
  .titre-doc{font-size:24px;font-weight:600;letter-spacing:-.3px;color:var(--noir);line-height:1.12}
  .sous-titre{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris-fonce);margin-top:6px}
  .form-zone{padding:20px 22px 10px}
  .identite{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .id-card{border:var(--bordure-fine);background:rgba(255,255,255,.35);padding:12px}
  .id-valeur{font-weight:600;font-size:15px;min-height:20px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
  .form-row.full{grid-column:1 / -1}
  .field{font-family:var(--font-sans);font-size:17px;font-weight:500;border:2px solid var(--noir);background:white;color:var(--noir);padding:12px 13px;outline:none;width:100%;min-height:48px}
  textarea.field{min-height:86px;resize:vertical;line-height:1.35}
  .hint{font-family:var(--font-mono);font-size:10px;color:var(--gris-fonce);margin-top:6px;line-height:1.3}
  .actions{padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap;border-top:var(--bordure);background:var(--gris-leger);align-items:center}
  .btn{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:11px 18px;border:2px solid var(--noir);cursor:pointer;background:var(--blanc);color:var(--noir);box-shadow:2px 2px 0 var(--noir)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.btn-primary{background:var(--accent);color:var(--blanc)}.btn-success{background:var(--vert);color:white;border-color:var(--vert)}
  .save-status{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--gris-fonce)}
  .historique,.responsable-zone{padding:0 22px 18px}
  .historique h2,.responsable-zone h2{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gris-fonce);margin:8px 0}
  .historique-item{border-top:var(--bordure-fine);padding:9px 0;font-size:13px;display:flex;justify-content:space-between;gap:12px}
  .historique-date{font-family:var(--font-mono);font-size:11px;color:var(--gris-fonce);white-space:nowrap}
  .toolbar-resp{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:16px 0}
  .toolbar-resp .field{max-width:210px}
  .vehicule-card{border:var(--bordure);background:white;margin:12px 0}
  .vehicule-head{background:var(--accent);color:var(--blanc);font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;padding:10px 12px}
  .releve-card{border-top:var(--bordure-fine);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
  .releve-card strong{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--gris-fonce);display:block;margin-bottom:2px}
  .empty-state{border:var(--bordure-fine);padding:18px;background:rgba(255,255,255,.45);font-family:var(--font-mono);font-size:12px;color:var(--gris-fonce)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--noir);color:var(--blanc);font-family:var(--font-mono);font-size:12px;padding:12px 20px;border:2px solid var(--blanc);box-shadow:4px 4px 0 rgba(0,0,0,.3);opacity:0;transition:all .3s;z-index:1000;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  @media (max-width:640px){
    body{padding:14px 10px 48px}.entete{padding:16px;align-items:flex-start}.app-logo{width:58px;height:58px}.titre-doc{font-size:20px}
    .form-zone{padding:16px}.identite,.form-grid,.releve-card{grid-template-columns:1fr}.actions{padding:12px}.save-status{width:100%;margin-left:0}.btn{font-size:10px;padding:10px 12px}
  }
  @media print{body{background:white;padding:0}#login-screen,.user-bar,.actions{display:none!important}.document{box-shadow:none;border:1px solid black}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <img class="login-logo" src="icon-192.png" alt="">
    <div class="login-titre">RELEVE D'HEURE<br>MENSUEL</div>
    <div class="login-sous-titre">Connexion chauffeur</div>
    <label class="pin-label" for="pin-input">Votre code PIN</label>
    <input class="pin-input" type="password" inputmode="numeric" id="pin-input" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter') seConnecter()">
    <div class="login-erreur" id="login-erreur"></div>
    <button class="btn btn-primary" id="btn-login" onclick="seConnecter()" style="width:100%;font-size:13px;padding:14px;">Se connecter</button>
  </div>
</div>

<div id="app-screen">
  <div class="document">
    <div class="user-bar">
      <div class="user-bar-info">
        <span class="user-bar-nom" id="user-nom">-</span>
        <span class="user-bar-role" id="user-role">-</span>
      </div>
      <button class="btn-deconnexion" onclick="seDeconnecter()">Deconnexion</button>
    </div>
    <div class="entete">
      <img class="app-logo" src="icon-192.png" alt="">
      <div>
        <div class="titre-doc">Releve d'heure mensuel</div>
        <div class="sous-titre">Suivi des engins HR Occitanie</div>
      </div>
    </div>

    <div class="form-zone" id="form-zone">
      <div class="identite">
        <div class="id-card">
          <span class="label">Chauffeur</span>
          <div class="id-valeur" id="chauffeur-identite">-</div>
        </div>
        <div class="id-card">
          <span class="label">Mois concerne</span>
          <input class="field" type="month" id="mois" onchange="sauvegarderLocal()">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label class="label" for="site">Site</label>
          <input class="field" id="site" type="text" autocomplete="off" oninput="sauvegarderLocal()">
        </div>
        <div class="form-row">
          <label class="label" for="date-releve">Date</label>
          <input class="field" id="date-releve" type="date" onchange="sauvegarderLocal()">
        </div>
        <div class="form-row full">
          <label class="label" for="immatriculation">Immatriculation</label>
          <input class="field" id="immatriculation" type="text" autocomplete="off" oninput="sauvegarderLocal()">
          <div class="hint">Saisir l'engin demande, meme si ce n'est pas l'engin habituel.</div>
        </div>
        <div class="form-row">
          <label class="label" for="heure-porteur">Heure porteur</label>
          <input class="field" id="heure-porteur" type="number" inputmode="decimal" step="0.1" min="0" oninput="sauvegarderLocal()">
        </div>
        <div class="form-row">
          <label class="label" for="heure-auxiliaires">Heure auxiliaires</label>
          <input class="field" id="heure-auxiliaires" type="number" inputmode="decimal" step="0.1" min="0" oninput="sauvegarderLocal()">
        </div>
        <div class="form-row full">
          <label class="label" for="kilometrage">Kilometrages</label>
          <input class="field" id="kilometrage" type="number" inputmode="decimal" step="1" min="0" oninput="sauvegarderLocal()">
        </div>
        <div class="form-row full">
          <label class="label" for="commentaire">Commentaire</label>
          <textarea class="field" id="commentaire" oninput="sauvegarderLocal()"></textarea>
        </div>
      </div>
    </div>

    <div class="historique" id="historique-zone" style="display:none">
      <h2>Derniers envois confirmes</h2>
      <div id="historique"></div>
    </div>

    <div class="responsable-zone" id="responsable-zone" style="display:none">
      <div class="toolbar-resp">
        <div>
          <label class="label" for="mois-responsable">Mois consulte</label>
          <input class="field" type="month" id="mois-responsable">
        </div>
        <button class="btn btn-primary" onclick="chargerRelevesResponsable()">Actualiser</button>
      </div>
      <h2>Releves par vehicule</h2>
      <div id="responsable-contenu" class="empty-state">Aucun relevé chargé.</div>
    </div>

    <div class="actions" id="actions-zone">
      <button class="btn btn-success" id="btn-envoyer" onclick="envoyerReleve()">Envoyer</button>
      <button class="btn btn-primary" onclick="exportCSV()">CSV</button>
      <button class="btn" onclick="imprimer()">Imprimer</button>
      <button class="btn" onclick="nouveauReleve()">Nouveau</button>
      <span class="save-status" id="save-status">Non synchronise</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'COLLER_ICI_URL_DEPLOIEMENT_APPS_SCRIPT';
const CONDUCTEURS_DEMO = [
  { id:'1', nom:'BAOUZ', prenom:'JULIEN', pin:'3960', role:'employe' },
  { id:'2', nom:'LANGE', prenom:'DAVID', pin:'5678', role:'responsable' },
  { id:'3', nom:'BOUCHEROT', prenom:'REMY', pin:'5412', role:'employe' },
  { id:'4', nom:'NOM EMPLOYE 3', prenom:'YVAN', pin:'6875', role:'employe' },
  { id:'5', nom:'NOM EMPLOYE 4', prenom:'YACIN', pin:'5143', role:'employe' },
  { id:'6', nom:'PHAN', prenom:'HUGO', pin:'8732', role:'employe' }
];

let utilisateur = null;

function estAPIConfiguree(){return API_URL && !API_URL.includes('COLLER_ICI');}
function apiObligatoire(){
  if(estAPIConfiguree()) return true;
  afficherStatut('API Google Sheets non configuree','var(--rouge)');
  afficherToast('Google Sheets non configure');
  return false;
}
function afficherToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function afficherStatut(msg,couleur='var(--gris-fonce)'){const el=document.getElementById('save-status');el.textContent=msg;el.style.color=couleur;}
function moisCourant(){return new Date().toISOString().slice(0,7);}
function dateCourante(){return new Date().toISOString().slice(0,10);}
function cleBrouillon(){return utilisateur ? `releve_mensuel_brouillon_${utilisateur.id}` : 'releve_mensuel_brouillon';}
function cleHistorique(){return utilisateur ? `releve_mensuel_historique_${utilisateur.id}` : 'releve_mensuel_historique';}

function init(){
  const saved = localStorage.getItem('releve_engins_session');
  if(saved){try{utilisateur=JSON.parse(saved);afficherAppli();return;}catch(e){localStorage.removeItem('releve_engins_session');}}
  afficherLogin();
}
function afficherLogin(){document.getElementById('login-screen').style.display='flex';document.getElementById('app-screen').style.display='none';}
function afficherAppli(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  const nomComplet = `${utilisateur.prenom || ''} ${utilisateur.nom || ''}`.trim();
  document.getElementById('user-nom').textContent = nomComplet;
  document.getElementById('user-role').textContent = utilisateur.role || 'employe';
  document.getElementById('chauffeur-identite').textContent = nomComplet;
  document.getElementById('mois-responsable').value = moisCourant();
  if(utilisateur.role === 'responsable') afficherVueResponsable(); else afficherVueEmploye();
}
function afficherVueEmploye(){
  document.getElementById('form-zone').style.display='block';
  document.getElementById('historique-zone').style.display='none';
  document.getElementById('responsable-zone').style.display='none';
  document.getElementById('actions-zone').style.display='flex';
  chargerBrouillon();
  afficherHistorique();
}
function afficherVueResponsable(){
  document.getElementById('form-zone').style.display='none';
  document.getElementById('historique-zone').style.display='none';
  document.getElementById('responsable-zone').style.display='block';
  document.getElementById('actions-zone').style.display='none';
  chargerRelevesResponsable();
}
async function seConnecter(){
  const pin=document.getElementById('pin-input').value.trim();
  const err=document.getElementById('login-erreur');
  if(!pin){err.textContent='Code PIN requis.';return;}
  const btn=document.getElementById('btn-login');btn.disabled=true;err.textContent='';
  if(!estAPIConfiguree()){
    const user=CONDUCTEURS_DEMO.find(u=>u.pin===pin);
    if(user){utilisateur={id:user.id,nom:user.nom,prenom:user.prenom,role:user.role};localStorage.setItem('releve_engins_session',JSON.stringify(utilisateur));afficherAppli();afficherToast('Mode local');}
    else err.textContent='PIN incorrect.';
    btn.disabled=false;return;
  }
  try{
    const res=await fetch(`${API_URL}?action=login&pin=${encodeURIComponent(pin)}&userAgent=${encodeURIComponent(navigator.userAgent)}`);
    const json=await res.json();
    if(json.success){utilisateur=json.user;localStorage.setItem('releve_engins_session',JSON.stringify(utilisateur));afficherAppli();}
    else err.textContent='PIN incorrect.';
  }catch(e){err.textContent='Connexion impossible.';}
  btn.disabled=false;
}
function seDeconnecter(){localStorage.removeItem('releve_engins_session');utilisateur=null;afficherLogin();}

function lireFormulaire(){
  return {
    mois: document.getElementById('mois').value,
    site: document.getElementById('site').value.trim(),
    dateReleve: document.getElementById('date-releve').value,
    immatriculation: document.getElementById('immatriculation').value.trim(),
    heurePorteur: document.getElementById('heure-porteur').value,
    heureAuxiliaires: document.getElementById('heure-auxiliaires').value,
    kilometrage: document.getElementById('kilometrage').value,
    commentaire: document.getElementById('commentaire').value.trim()
  };
}
function remplirFormulaire(d){
  document.getElementById('mois').value=d.mois || moisCourant();
  document.getElementById('site').value=d.site || '';
  document.getElementById('date-releve').value=d.dateReleve || dateCourante();
  document.getElementById('immatriculation').value=d.immatriculation || '';
  document.getElementById('heure-porteur').value=d.heurePorteur || '';
  document.getElementById('heure-auxiliaires').value=d.heureAuxiliaires || '';
  document.getElementById('kilometrage').value=d.kilometrage || '';
  document.getElementById('commentaire').value=d.commentaire || '';
}
function chargerBrouillon(){
  const saved=localStorage.getItem(cleBrouillon());
  if(saved){try{remplirFormulaire(JSON.parse(saved));afficherStatut('Brouillon local');return;}catch(e){}}
  remplirFormulaire({});
}
function sauvegarderLocal(){
  if(!utilisateur)return;
  localStorage.setItem(cleBrouillon(),JSON.stringify(lireFormulaire()));
  afficherStatut('Brouillon local');
}
function verifierReleve(d){
  if(!d.mois)return 'Mois concerne obligatoire.';
  if(!d.site)return 'Site obligatoire.';
  if(!d.dateReleve)return 'Date obligatoire.';
  if(!d.immatriculation)return 'Immatriculation obligatoire.';
  if(d.heurePorteur==='' && d.heureAuxiliaires==='' && d.kilometrage==='') return 'Renseigne au moins une heure ou un kilometrage.';
  return '';
}
async function envoyerReleve(){
  if(!apiObligatoire()) return;
  const releve=lireFormulaire();
  const erreur=verifierReleve(releve);
  if(erreur){afficherToast(erreur);return;}
  const btn=document.getElementById('btn-envoyer');btn.disabled=true;btn.textContent='Envoi...';afficherStatut('Envoi en cours...');
  const payload={action:'saveReleveMensuel', conducteur:utilisateur, releve};
  try{
    const res=await fetch(`${API_URL}?userAgent=${encodeURIComponent(navigator.userAgent)}`,{method:'POST',body:JSON.stringify(payload)});
    const json=await res.json();
    if(!json.success)throw new Error(json.error || 'Erreur envoi');
    enregistrerHistorique(releve);
    localStorage.removeItem(cleBrouillon());
    afficherStatut('Envoye', 'var(--vert)');
    afficherToast('Releve envoye au Google Sheet');
    nouveauReleve(false);
  }catch(e){
    afficherStatut('Erreur envoi','var(--rouge)');
    afficherToast('Envoi impossible');
  }
  btn.disabled=false;btn.textContent='Envoyer';
}
async function chargerRelevesResponsable(){
  const zone=document.getElementById('responsable-contenu');
  const mois=document.getElementById('mois-responsable').value || moisCourant();
  if(!apiObligatoire()){
    zone.className='empty-state';
    zone.textContent='API Google Sheets non configuree.';
    return;
  }
  zone.className='empty-state';
  zone.textContent='Chargement...';
  try{
    const params = new URLSearchParams({
      action:'getRelevesMensuels',
      mois,
      idUtilisateur:utilisateur.id,
      nom:utilisateur.nom,
      prenom:utilisateur.prenom,
      role:utilisateur.role,
      userAgent:navigator.userAgent
    });
    const res=await fetch(`${API_URL}?${params.toString()}`);
    const json=await res.json();
    if(!json.success) throw new Error(json.error || 'Erreur chargement');
    renderResponsable(json.releves || []);
  }catch(e){
    zone.className='empty-state';
    zone.textContent='Impossible de charger les releves.';
  }
}
function renderResponsable(releves){
  const zone=document.getElementById('responsable-contenu');
  if(!releves.length){
    zone.className='empty-state';
    zone.textContent='Aucun releve pour ce mois.';
    return;
  }
  const groupes = releves.reduce((acc,r)=>{
    const key=(r.immatriculation || 'Sans immatriculation').toUpperCase();
    if(!acc[key]) acc[key]=[];
    acc[key].push(r);
    return acc;
  },{});
  zone.className='';
  zone.innerHTML=Object.entries(groupes).sort(([a],[b])=>a.localeCompare(b)).map(([immat,items])=>`
    <div class="vehicule-card">
      <div class="vehicule-head">${echapperHTML(immat)} - ${items.length} releve${items.length>1?'s':''}</div>
      ${items.map(r=>`
        <div class="releve-card">
          <div><strong>Chauffeur</strong>${echapperHTML(`${r.prenom || ''} ${r.nom || ''}`.trim())}</div>
          <div><strong>Envoye le</strong>${echapperHTML(r.timestamp)}</div>
          <div><strong>Site</strong>${echapperHTML(r.site)}</div>
          <div><strong>Date releve</strong>${echapperHTML(r.dateReleve)}</div>
          <div><strong>Heure porteur</strong>${echapperHTML(r.heurePorteur)}</div>
          <div><strong>Heure auxiliaires</strong>${echapperHTML(r.heureAuxiliaires)}</div>
          <div><strong>Kilometrage</strong>${echapperHTML(r.kilometrage)}</div>
          <div><strong>Commentaire</strong>${echapperHTML(r.commentaire || '-')}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}
function enregistrerHistorique(releve){
  const historique=JSON.parse(localStorage.getItem(cleHistorique()) || '[]');
  historique.unshift({...releve, envoyeLe:new Date().toLocaleString('fr-FR')});
  localStorage.setItem(cleHistorique(),JSON.stringify(historique.slice(0,5)));
  afficherHistorique();
}
function afficherHistorique(){
  const historique=JSON.parse(localStorage.getItem(cleHistorique()) || '[]');
  const zone=document.getElementById('historique-zone');
  const list=document.getElementById('historique');
  if(!historique.length){zone.style.display='none';return;}
  zone.style.display='block';
  list.innerHTML=historique.map(h=>`<div class="historique-item"><span>${echapperHTML(h.mois)} - ${echapperHTML(h.immatriculation)} - ${echapperHTML(h.site)}</span><span class="historique-date">${echapperHTML(h.envoyeLe)}</span></div>`).join('');
}
function nouveauReleve(garderMois=true){
  const mois=document.getElementById('mois').value || moisCourant();
  remplirFormulaire({mois:garderMois?mois:moisCourant(),dateReleve:dateCourante()});
  sauvegarderLocal();
}
function exportCSV(){
  const d=lireFormulaire();
  const lignes=[
    ['RELEVE D HEURE MENSUEL HR OCCITANIE'],
    ['Chauffeur',`${utilisateur.prenom} ${utilisateur.nom}`],
    ['Mois',d.mois],
    [],
    ['Site','Date','Immatriculation','Heure porteur','Heure auxiliaires','Kilometrages','Commentaire'],
    [d.site,d.dateReleve,d.immatriculation,d.heurePorteur,d.heureAuxiliaires,d.kilometrage,d.commentaire]
  ];
  const csv=lignes.map(r=>r.map(v=>`"${String(v ?? '').replaceAll('"','""')}"`).join(';')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`releve_engin_${d.mois || 'mois'}_${d.immatriculation || 'engin'}.csv`;a.click();
  URL.revokeObjectURL(url);afficherToast('CSV exporte');
}
function imprimer(){window.print();}
function echapperHTML(val){return String(val ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
init();
</script>
